<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Destin's Game">
  <meta name="theme-color" content="#1a1040">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Destin's Game: a friendly ninja adventure for little heroes!">
  <title>Destin's Game</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #1a1040; touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
      position: fixed; inset: 0;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const TAU = Math.PI * 2;
  const FONT = '"Chalkboard SE","Comic Sans MS","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif';


  let W = 1180, H = 820, DPR = 1;
  let state = "title";
  let time = 0, lastTs = 0;
  let stars = 0, levelIndex = 0, levelTime = 0, levelKills = 0;
  let banner = null, cheer = null, ninja = null;
  let zombies = [], shurikens = [], particles = [], floaters = [];
  let spawnTimer = 0, nextZid = 1, camX = 0, combo = 0;
  let playPressed = false;
  let held = { tri: false, x: false, left: false, right: false, jump: false };
  let btnRepeat = { tri: 0, x: 0 };
  let buttons = { tri: null, x: null, play: null, left: null, right: null, jump: null };
  let groundY = 600;
  let shotMode = false;
  let levelW = 3200, platforms = [], flag = { x: 3000, y: 400 }, tower = null;
  let pointers = new Map();
  let jumpBuf = 0, coyote = 0, jumpPrev = false, levelLock = 0;
  const WALK_SP = 340, JUMP_V = -920, GRAVITY = 1750;

  const CHEERS = ["Great job!","Super star!","Wow!","Awesome!","You did it!","Ninja power!","Amazing!","Yes!","Wow Destin!","Super ninja!","Nice!","Hooray!"];

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b - a) * t; }
  function rand(a,b){ return a + Math.random() * (b - a); }
  function rint(a,b){ return (Math.random() * (b - a + 1) | 0) + a; }
  function chance(p){ return Math.random() < p; }
  function hash(n){ const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  function easeOutBack(t){ const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  function angleTo(ax,ay,bx,by){ return Math.atan2(by - ay, bx - ax); }

  function roundRect(c,x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    c.beginPath();
    c.moveTo(x+rr,y);
    c.arcTo(x+w,y,x+w,y+h,rr);
    c.arcTo(x+w,y+h,x,y+h,rr);
    c.arcTo(x,y+h,x,y,rr);
    c.arcTo(x,y,x+w,y,rr);
    c.closePath();
  }
  function ellipse(c,x,y,rx,ry){
    c.beginPath();
    c.ellipse(x,y,Math.max(0.5,rx),Math.max(0.5,ry),0,0,TAU);
  }
  function strokeFill(c, fill, stroke, lw){
    c.fillStyle = fill; c.fill();
    if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw||4; c.lineJoin = "round"; c.lineCap = "round"; c.stroke(); }
  }
  function text(c,str,x,y,size,fill,stroke,lw,align,baseline){
    c.font = "700 " + size + "px " + FONT;
    c.textAlign = align || "center";
    c.textBaseline = baseline || "middle";
    if (stroke){
      c.strokeStyle = stroke;
      c.lineWidth = lw || Math.max(4, size * 0.14);
      c.lineJoin = "round"; c.miterLimit = 2;
      c.strokeText(str,x,y);
    }
    c.fillStyle = fill || "#fff";
    c.fillText(str,x,y);
  }

  const Sfx = {
    ctx: null, master: null, sfxG: null, musG: null,
    unlocked: false, step: 0, acc: 0, muted: false,
    ensure(){
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.45;
      this.master.connect(this.ctx.destination);
      this.sfxG = this.ctx.createGain();
      this.sfxG.gain.value = 0.9;
      this.sfxG.connect(this.master);
      this.musG = this.ctx.createGain();
      this.musG.gain.value = 0.16;
      this.musG.connect(this.master);
    },
    unlock(){
      this.ensure();
      if (!this.ctx) return;
      if (this.ctx.state === "suspended") this.ctx.resume();
      this.unlocked = true;
    },
    tone(freq,dur,type,gain,when,slide,dest){
      if (!this.ctx || !this.unlocked || this.muted) return;
      const t0 = this.ctx.currentTime + (when||0);
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain||0.12, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(dest || this.sfxG);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    },
    noise(dur,gain,when,hp){
      if (!this.ctx || !this.unlocked || this.muted) return;
      const t0 = this.ctx.currentTime + (when||0);
      const n = this.ctx.createBuffer(1, Math.max(1, this.ctx.sampleRate * dur), this.ctx.sampleRate);
      const d = n.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
      const src = this.ctx.createBufferSource(); src.buffer = n;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(gain||0.08, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      let node = src;
      if (hp && this.ctx.createBiquadFilter){
        const f = this.ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
        src.connect(f); node = f;
      }
      node.connect(g); g.connect(this.sfxG);
      src.start(t0); src.stop(t0 + dur + 0.02);
    },
    slash(){ this.noise(0.12,0.1,0,800); this.tone(720,0.12,"sawtooth",0.08,0,280); this.tone(980,0.08,"square",0.05,0.02,400); },
    throw(){ this.tone(520,0.14,"square",0.08,0,1200); this.tone(780,0.16,"triangle",0.06,0.03,1600); },
    pop(){ this.tone(523,0.14,"triangle",0.12); this.tone(659,0.16,"triangle",0.1,0.04); this.tone(784,0.2,"triangle",0.09,0.08); this.noise(0.1,0.06,0,400); },
    bonk(){ this.tone(180,0.16,"sine",0.14,0,90); this.tone(240,0.18,"triangle",0.08,0.04,120); },
    ding(){ this.tone(880,0.12,"sine",0.1); this.tone(1320,0.18,"sine",0.07,0.05); },
    button(){ this.tone(660,0.07,"square",0.06); },
    fanfare(){ [523,659,784,1046].forEach((n,i)=>this.tone(n,0.22,"triangle",0.12,i*0.1)); this.tone(1318,0.35,"sine",0.08,0.42); },
    cheer(){ this.tone(659,0.12,"triangle",0.1); this.tone(784,0.14,"triangle",0.1,0.08); this.tone(1046,0.22,"triangle",0.12,0.16); },
    emerge(){ this.noise(0.18,0.07,0,200); this.tone(140,0.16,"sine",0.05,0,80); },
    jump(){ this.tone(420,0.12,"square",0.07,0,780); this.tone(640,0.1,"triangle",0.05,0.02,980); },
    tick(dt){
      if (!this.ctx || !this.unlocked || this.muted || state !== "play") return;
      this.acc += dt;
      const stepDur = 0.22;
      while (this.acc >= stepDur){
        this.acc -= stepDur;
        const melody = [0,4,7,12,7,4,9,7,4,0,5,7,4,7,12,7];
        const bass = [0,0,5,5,-3,-3,0,0,0,0,5,5,-5,-5,0,0];
        const i = this.step % melody.length;
        const base = 262;
        this.tone((base/2)*Math.pow(2,bass[i]/12), 0.18, "triangle", 0.09, 0, null, this.musG);
        if (i%2===0) this.tone(base*Math.pow(2,melody[i]/12), 0.16, "square", 0.05, 0, null, this.musG);
        else this.tone(base*2*Math.pow(2,melody[i]/12), 0.1, "sine", 0.04, 0, null, this.musG);
        this.step++;
      }
    }
  };

  function burst(x,y,kind,n){
    n = n || 18;
    const colors = kind === "dirt"
      ? ["#6b3f1f","#8a5a2b","#c4a574","#4a2c14","#d9c08a"]
      : ["#ffe066","#ff6b6b","#4ecdc4","#ffeaa7","#74b9ff","#fd79a8","#55efc4","#fdcb6e","#a29bfe"];
    for (let i=0;i<n;i++){
      const a = rand(0,TAU);
      const sp = kind === "dirt" ? rand(40,160) : rand(60,280);
      particles.push({
        x,y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - (kind==="dirt"?80:120),
        g: kind==="dirt"?520:380, life:1, decay: rand(0.8,1.6),
        size: kind==="dirt"?rand(3,8):rand(4,10),
        color: colors[rint(0,colors.length-1)],
        rot: rand(0,TAU), rotv: rand(-8,8),
        shape: kind==="dirt"?"dot":(chance(0.45)?"star":(chance(0.5)?"rect":"dot")),
        kind
      });
    }
  }
  function sparkle(x,y,n){
    n = n||8;
    for (let i=0;i<n;i++){
      const a=rand(0,TAU), sp=rand(20,90);
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,g:80,life:1,decay:rand(1.2,2.2),size:rand(2,5),color:chance(0.5)?"#fff7b0":"#ffffff",rot:0,rotv:0,shape:"star",kind:"spark"});
    }
  }
  function confettiRain(n){
    n=n||28;
    const cols=["#ffe066","#ff6b6b","#4ecdc4","#74b9ff","#fd79a8","#55efc4","#fdcb6e"];
    for (let i=0;i<n;i++){
      particles.push({x:rand(0,W),y:rand(-40,-4),vx:rand(-40,40),vy:rand(40,140),g:80,life:1.4,decay:0.35,size:rand(5,11),color:cols[rint(0,6)],rot:rand(0,TAU),rotv:rand(-10,10),shape:"rect",kind:"confetti",space:"screen"});
    }
  }
  function addFloater(str,x,y,color){ floaters.push({str,x,y,t:0,color:color||"#ffe566"}); }
  function showCheer(explicit){
    combo++;
    cheer = { text: explicit || CHEERS[rint(0,CHEERS.length-1)], t:0, dur:1.35 };
    confettiRain(24); Sfx.cheer();
  }


  function makeNinja(){
    return { x:200, y:groundY, vy:0, prevY:groundY, onGround:true, face:1, state:"idle", anim:0, t:0, blink:0, inv:0, scarf:0, walk:0 };
  }
  function spawnZombie(opts){
    opts = opts || {};
    const face = ninja ? ninja.face : 1;
    const ahead = ninja ? ninja.x + face * rand(220, 640) : 500;
    const x = opts.x != null ? opts.x : clamp(ahead, 80, (flag?flag.x:levelW) - 200);
    const z = { id:nextZid++, x, y:groundY, face: x < (ninja?ninja.x:W/2) ? 1 : -1, kind:rint(0,5), emerge: opts.emerged?1:0, state: opts.emerged?"walk":"emerge", walk:rand(0,10), speed:rand(28,46), wobble:rand(0,TAU), hurt:0, scale:rand(0.88,1.12) };
    zombies.push(z);
    if (!opts.emerged && !opts.silent){ burst(z.x, groundY, "dirt", 14); Sfx.emerge(); }
    return z;
  }
  function nearestZombie(fromX, onlyReady){
    let best=null, bd=1e9;
    for (const z of zombies){
      if (z.state==="hit") continue;
      if (onlyReady && z.emerge < 0.6) continue;
      const d=Math.abs(z.x-fromX);
      if (d<bd){ bd=d; best=z; }
    }
    return best;
  }
  function zombieInFront(){
    if (!ninja) return null;
    let best=null, bd=1e9;
    for (const z of zombies){
      if (z.state==="hit" || z.emerge<0.6) continue;
      const dx=z.x-ninja.x;
      if (dx*ninja.face < -20) continue;
      const d=Math.abs(dx);
      if (d<bd){ bd=d; best=z; }
    }
    return best;
  }
  function poofZombie(z){
    z.state="hit";
    burst(z.x, z.y-50, "confetti", 28);
    sparkle(z.x, z.y-60, 12);
    Sfx.pop();
    stars += 1; levelKills += 1;
    addFloater("+1", z.x, z.y-90, "#ffe566");
    if (levelKills % 5 === 0) showCheer();
    else if (chance(0.18)) showCheer();
  }
  function slashAttack(){
    if (!ninja || ninja.state==="bonk") return;
    ninja.state="slash"; ninja.anim=0; Sfx.slash();
    const range = Math.max(140, Math.min(W,H)*0.22);
    const arcX = ninja.x + ninja.face*50, arcY = ninja.y-50;
    for (let i=0;i<10;i++){
      const a = (ninja.face>0 ? -0.9 : Math.PI-0.3) + rand(-0.4,0.6);
      particles.push({x:arcX,y:arcY,vx:Math.cos(a)*rand(80,220),vy:Math.sin(a)*rand(80,220),g:0,life:1,decay:3,size:rand(4,8),color:chance(0.5)?"#fff6a0":"#ffffff",rot:0,rotv:0,shape:"star",kind:"spark"});
    }
    let hit=0;
    for (const z of zombies){
      if (z.state==="hit" || z.emerge<0.35) continue;
      const dx=z.x-ninja.x;
      const sameDir = dx*ninja.face >= -20;
      const dist=Math.hypot(dx,(z.y-ninja.y)*0.4);
      if (sameDir && dist<range){ poofZombie(z); hit++; }
    }
    if (hit) Sfx.ding();
  }
  function throwStar(target){
    if (!ninja || ninja.state==="bonk") return;
    ninja.state="throw"; ninja.anim=0;
    if (target) ninja.face = target.x >= ninja.x ? 1 : -1;
    Sfx.throw();
    const tx = target ? target.x : ninja.x + ninja.face*400;
    const ty = target ? target.y-55 : ninja.y-55;
    const sx = ninja.x + ninja.face*28, sy = ninja.y-58;
    const a = angleTo(sx,sy,tx,ty), sp=620;
    shurikens.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:0,rotv:18,target:target?target.id:0,life:1.6});
  }
  function bonkNinja(z){
    if (ninja.inv>0 || ninja.state==="bonk") return;
    ninja.state="bonk"; ninja.anim=0; ninja.inv=1.15;
    Sfx.bonk();
    addFloater("Bonk!", ninja.x, ninja.y-110, "#fff0a0");
    ninja.face = z.x>=ninja.x ? 1 : -1;
    z.x += (z.x>=ninja.x?1:-1)*70;
    sparkle(ninja.x, ninja.y-70, 8);
  }

  const LEVELS = [
    { name:"Spooky Yard",  sky:["#1a1248","#3a1d6e","#6b3aa0"], ground:"#2a4a28", groundTop:"#3d6a38", dirt:"#5a3a20" },
    { name:"Forest Fun",   sky:["#8fd3ff","#b8e986","#4c9a4a"], ground:"#3d6b2a", groundTop:"#5a9a3a", dirt:"#6b3f1f" },
    { name:"Sunny Desert", sky:["#7ec8ff","#ffe08a","#f4c36a"], ground:"#e0b15a", groundTop:"#f0d08a", dirt:"#c4963a" },
    { name:"Snowy Peak",   sky:["#d8f0ff","#a8d4f0","#7fb3d8"], ground:"#e8f4ff", groundTop:"#ffffff", dirt:"#c0d4e8" },
    { name:"Sandy Beach",  sky:["#7ad7ff","#fff1a8","#5ec8e8"], ground:"#f4d58a", groundTop:"#ffe9b0", dirt:"#d0a45a" },
    { name:"Candy Land",   sky:["#ffb3e0","#ffd6f0","#c9b6ff"], ground:"#ff8ec8", groundTop:"#ffb3de", dirt:"#e070b0" },
    { name:"City Lights",  sky:["#1b1148","#c0503a","#f0a050"], ground:"#3a3a4a", groundTop:"#5a5a6a", dirt:"#2a2a33" },
    { name:"Moon Mission", sky:["#07061a","#16124a","#2a1a6a"], ground:"#c8c0b8", groundTop:"#e8e0d4", dirt:"#9a948c" },
    { name:"Flower Field", sky:["#7ec8ff","#c8f0ff","#ffe9a0"], ground:"#4c9a3a", groundTop:"#7edc55", dirt:"#6b3f1f" },
    { name:"Bubble Bay",   sky:["#083a68","#1a7aad","#3ec8c8"], ground:"#d8c07a", groundTop:"#f0dc9a", dirt:"#b89850" },
    { name:"Pumpkin Path", sky:["#f0a04a","#f0c878","#c06030"], ground:"#6b4420", groundTop:"#8a5a28", dirt:"#4a3018" },
    { name:"Rainbow Sky",  sky:["#7ec8ff","#ffd1f0","#c8f0ff"], ground:"#b8ecff", groundTop:"#ffffff", dirt:"#9ad4f0" }
  ];
  function currentLevel(){ return LEVELS[levelIndex % LEVELS.length]; }
  function skyGrad(c,stops,x,y,w,h){
    const g=c.createLinearGradient(0,0,0,h);
    stops.forEach((col,i)=>g.addColorStop(i/(stops.length-1),col));
    c.fillStyle=g; c.fillRect(x,y,w,h);
  }
  function drawMoon(c,x,y,r){
    ellipse(c,x,y,r,r); strokeFill(c,"#fff6c8","#ffe9a0",3);
    c.fillStyle="rgba(255,230,160,0.18)"; ellipse(c,x,y,r*1.45,r*1.45); c.fill();
    c.fillStyle="rgba(230,200,130,0.25)";
    ellipse(c,x-r*0.25,y-r*0.15,r*0.22,r*0.18); c.fill();
    ellipse(c,x+r*0.3,y+r*0.2,r*0.16,r*0.14); c.fill();
  }
  function drawSun(c,x,y,r,t){
    c.save(); c.translate(x,y); c.rotate(t*0.15);
    c.strokeStyle="rgba(255,220,80,0.55)"; c.lineWidth=6; c.lineCap="round";
    for(let i=0;i<12;i++){ const a=(i/12)*TAU; c.beginPath(); c.moveTo(Math.cos(a)*(r+8),Math.sin(a)*(r+8)); c.lineTo(Math.cos(a)*(r+28),Math.sin(a)*(r+28)); c.stroke(); }
    c.restore();
    ellipse(c,x,y,r,r); strokeFill(c,"#ffe566","#ffb703",4);
    c.fillStyle="rgba(255,240,150,0.35)"; ellipse(c,x,y,r*1.35,r*1.35); c.fill();
  }
  function drawCloud(c,x,y,s,col){
    c.fillStyle=col||"rgba(255,255,255,0.9)";
    ellipse(c,x,y,28*s,16*s); c.fill();
    ellipse(c,x-20*s,y+4*s,18*s,12*s); c.fill();
    ellipse(c,x+22*s,y+3*s,20*s,13*s); c.fill();
    ellipse(c,x+4*s,y-10*s,16*s,12*s); c.fill();
  }
  function drawTree(c,x,y,s,canopy,trunk){
    c.fillStyle=trunk||"#6b3f1f";
    roundRect(c,x-8*s,y-40*s,16*s,42*s,4*s); c.fill();
    c.fillStyle=canopy||"#2d8a3e";
    ellipse(c,x,y-70*s,38*s,32*s); c.fill();
    ellipse(c,x-28*s,y-52*s,26*s,22*s); c.fill();
    ellipse(c,x+28*s,y-52*s,26*s,22*s); c.fill();
    c.fillStyle="rgba(255,255,255,0.12)";
    ellipse(c,x-10*s,y-80*s,12*s,8*s); c.fill();
  }
  function drawPine(c,x,y,s,snow){
    c.fillStyle="#6b3f1f"; c.fillRect(x-6*s,y-20*s,12*s,22*s);
    const cols=["#1e5c32","#247a3e","#2e8f4a"];
    for(let i=0;i<3;i++){
      c.fillStyle=cols[i];
      c.beginPath();
      const top=y-110*s+i*28*s, w=(28+i*16)*s;
      c.moveTo(x,top); c.lineTo(x+w,top+40*s); c.lineTo(x-w,top+40*s); c.closePath(); c.fill();
      if(snow){ c.fillStyle="rgba(255,255,255,0.85)"; c.beginPath(); c.moveTo(x,top); c.lineTo(x+w*0.45,top+16*s); c.lineTo(x-w*0.45,top+16*s); c.closePath(); c.fill(); }
    }
  }
  function drawCactus(c,x,y,s){
    c.fillStyle="#2f9e4a"; c.strokeStyle="#1c6b30"; c.lineWidth=3;
    roundRect(c,x-12*s,y-80*s,24*s,84*s,12*s); c.fill(); c.stroke();
    roundRect(c,x-36*s,y-58*s,24*s,14*s,7*s); c.fill(); c.stroke();
    roundRect(c,x-36*s,y-70*s,14*s,26*s,7*s); c.fill(); c.stroke();
    roundRect(c,x+12*s,y-48*s,22*s,12*s,6*s); c.fill(); c.stroke();

  function drawNinja(c,n){

    const throwT = n.state==="throw" ? Math.min(1,n.anim/0.28) : 0;
    const bonkT  = n.state==="bonk"  ? Math.min(1,n.anim/0.45) : 0;
    const bob = n.state==="walk" ? Math.sin(n.walk*10)*3 : Math.sin(n.t*5)*2.2;

    c.save(); c.translate(-16,-62); c.rotate(-0.4-armSlash*0.3);

    c.fillStyle="#1a1a2e"; c.strokeStyle="#0b0b16"; c.lineWidth=3.5;

    }
    c.strokeStyle="#c4d0e0"; c.lineWidth=2;
    c.beginPath(); c.arc(0,-88,6,0.2,Math.PI-0.2); c.stroke();

    c.fillStyle="#e6392b"; c.strokeStyle="#9b1d1d"; c.lineWidth=2;

  function buildLevel(){
    const gy = groundY;
    const v = levelIndex % 3;
    levelW = 3200;
    platforms = [];
    function P(x,rise,w,kind){ platforms.push({x,y:gy-rise,w,h:28,kind:kind||"ledge"}); }
    if (v===0){ P(760,110,260); P(1180,190,220); P(1620,110,240); P(2040,150,200); }
    else if (v===1){ P(700,100,280); P(1140,100,200); P(1480,180,240); P(1960,120,220); }
    else { P(820,120,300); P(1300,190,240); P(1760,120,220); }
    const tx = 2420;
    P(tx, 100, 320, "tower");
    P(tx+110, 195, 300, "tower");
    P(tx+210, 290, 280, "tower");
    tower = { x:tx, w:500, top:gy-290 };
    const top = platforms[platforms.length-1];
    flag = { x: top.x + top.w*0.65, y: top.y };
  }
  function drawTowerAndPlatforms(c){

      c.fillStyle="rgba(0,0,0,0.18)";
      roundRect(c,x+8,top+8,w,h,10); c.fill();

      roundRect(c,x,top,w,h,10); c.fill();

      c.fillRect(x+12,top+16,10,Math.max(8,h-24));

      roundRect(c,x+w*0.5-18,groundY-70,36,70,8); c.fill();

      for (let i=0;i<2;i++){

    for (const p of platforms){

      roundRect(c,p.x,p.y,p.w,p.h,8); c.fill();

      c.strokeStyle="#1a1040"; c.lineWidth=3; c.stroke();

      c.strokeStyle="#9b1d1d"; c.lineWidth=2; c.stroke();

  function layoutButtons(){
    const short = Math.min(W,H);
    const isPortrait = H>W;
    const size = clamp(short*(isPortrait?0.155:0.15), 88, 132);
    const labelSpace = 22;
    const pad = 14;
    const gap = 8;
    const y = H - pad - labelSpace - size/2;
    buttons.left  = { x: pad+size/2, y, r: size/2 };
    buttons.right = { x: pad+size+gap+size/2, y, r: size/2 };
    buttons.jump  = { x: (buttons.left.x+buttons.right.x)/2, y: y-size-6, r: size/2 };
    buttons.tri = { x: W-pad-size-gap-size/2, y, r: size/2 };
    buttons.x   = { x: W-pad-size/2, y, r: size/2 };
    const playR = clamp(short*0.145, 66, 100);
    buttons.play = { x: W/2, y: Math.min(H*0.78, H - playR - 52), r: playR };
    groundY = y - size/2 - 14;
    if (groundY < H*0.48) groundY = H*0.52;
  }

    c.save(); c.globalAlpha=clamp(a,0,1); c.translate(W/2,y); c.scale(pop,pop);
    text(c,cheer.text,0,0,Math.min(58,W*0.1),"#ffe566","#1a1040",12);
    c.restore();
  }

  function drawTitle(c){
    skyGrad(c,["#1a1248","#3a1d6e","#f08a4a"],0,0,W,H);
    drawMoon(c,W*0.84,H*0.16,52);
    for(let i=0;i<50;i++){
      const sx=hash(i+2)*W, sy=hash(i+9)*H*0.55, tw=0.55+Math.sin(time*3+i)*0.45;
      c.fillStyle="rgba(255,255,220,"+(0.4+tw*0.6)+")"; ellipse(c,sx,sy,1.5,1.5); c.fill();
    }
    drawHill(c,W*0.2,H*0.78,400,140,"#1a2a40");
    drawHill(c,W*0.75,H*0.78,420,160,"#162238");
    c.fillStyle="#2a4a28"; c.fillRect(0,H*0.76,W,H*0.24);
    c.fillStyle="#3d6a38";
    c.beginPath(); c.moveTo(0,H*0.76);
    for(let x=0;x<=W;x+=16) c.lineTo(x,H*0.76+Math.sin(x*0.04)*3);
    c.lineTo(W,H); c.lineTo(0,H); c.fill();

    const gySave=groundY; groundY=H*0.76;
    for(let i=0;i<3;i++){
      drawZombie(c,{id:0,x:W*(0.16+i*0.12),y:groundY+Math.sin(time*2+i)*6,face:1,kind:i,emerge:1,state:"walk",walk:time+i,speed:0,wobble:0,hurt:0,scale:1});
    }
    for(let i=0;i<3;i++){
      drawZombie(c,{id:0,x:W*(0.7+i*0.1),y:groundY+Math.sin(time*2+i+2)*6,face:-1,kind:i+3,emerge:1,state:"walk",walk:time+i,speed:0,wobble:0,hurt:0,scale:1});
    }
    for(let i=0;i<4;i++){
      drawShuriken(c,{x:W*0.28+i*80+Math.sin(time*2+i)*8, y:H*0.36+Math.cos(time*2+i)*10, rot:time*6+i});
    }
    // Hero ninja stands above the Play button so he stays visible
    (function(){
      const b=buttons.play;
      const ny=Math.min(groundY, b.y - b.r - 8);
      c.save();
      c.translate(W*0.5, ny);
      c.scale(1.45, 1.45);
      c.translate(-W*0.5, -ny);
      drawNinja(c,{x:W*0.5,y:ny,face:1,state:"idle",anim:0,t:time,blink:(time%3.2),inv:0,scarf:0,walk:0});
      c.restore();
    })();
    groundY=gySave;

    const logoY=Math.min(H*0.16,140);
    const titleSize=clamp(Math.min(W,H)*0.11,44,86);
    text(c,"Destin's Game",W/2,logoY,titleSize,"#ffe566","#1a1040",titleSize*0.16);
    text(c,"Ninja vs. Silly Zombies!",W/2,logoY+titleSize*0.75,clamp(titleSize*0.36,18,32),"#fff","#1a1040",6);

    const b=buttons.play;
    const pulse=1+Math.sin(time*4)*0.06;
    c.save(); c.translate(b.x,b.y); c.scale(pulse*(playPressed?0.92:1), pulse*(playPressed?0.92:1));
    c.fillStyle="rgba(0,0,0,0.3)"; ellipse(c,0,10,b.r,b.r*0.3); c.fill();
    ellipse(c,0,0,b.r,b.r); strokeFill(c,"#51cf66","#fff",8);
    c.strokeStyle="#2b8a3e"; c.lineWidth=5; ellipse(c,0,0,b.r-10,b.r-10); c.stroke();
    c.fillStyle="rgba(255,255,255,0.28)"; ellipse(c,-b.r*0.15,-b.r*0.3,b.r*0.5,b.r*0.3); c.fill();
    c.fillStyle="#fff"; c.strokeStyle="#1b5e2a"; c.lineWidth=4;
    c.beginPath(); c.moveTo(-b.r*0.18,-b.r*0.38); c.lineTo(b.r*0.42,0); c.lineTo(-b.r*0.18,b.r*0.38); c.closePath(); c.fill(); c.stroke();
    c.restore();
    text(c,"PLAY!",b.x,b.y+b.r+26,30,"#fff","#1a1040",7);
    text(c,"◀ ▶ run    ▲ jump    △ hit    ✕ star", W/2, H-28, 16, "rgba(255,255,255,0.9)", "#1a1040", 5);
  }

  function startGame(){
    state="play"; stars=0; levelIndex=0; levelTime=0; levelKills=0; combo=0;
    zombies=[]; shurikens=[]; particles=[]; floaters=[];
    banner=null; cheer=null; spawnTimer=0.6; camX=0;
    jumpBuf=0; coyote=0; jumpPrev=false; levelLock=0;
    held.left=held.right=held.jump=held.tri=held.x=false;
    pointers.clear();
    layoutButtons(); buildLevel();
    ninja=makeNinja(); ninja.x=200; ninja.y=groundY;
    showBanner("Level 1!", currentLevel().name);
    Sfx.fanfare();
  }
  function showBanner(textStr,sub){ banner={text:textStr, sub:sub||"", t:0, dur:1.8}; }
  function nextLevel(){
    if (levelLock>0) return;
    levelLock=1.1;
    for (const z of zombies){ if (z.state!=="hit") burst(z.x,z.y-50,"confetti",16); }
    zombies=[]; shurikens=[];
    levelIndex++; levelTime=0; levelKills=0; spawnTimer=0.8;
    layoutButtons(); buildLevel();
    if (ninja){ ninja.x=200; ninja.y=groundY; ninja.vy=0; ninja.onGround=true; ninja.state="idle"; }
    camX=0;
    showBanner("Level "+(levelIndex+1)+"!", currentLevel().name);
    Sfx.fanfare(); confettiRain(36);
  }
  function goToLevel(i,opts){
    opts=opts||{};
    levelIndex=((i%LEVELS.length)+LEVELS.length)%LEVELS.length;
    levelTime=0; levelKills=0; spawnTimer=0.5;
    layoutButtons(); buildLevel();
    if (!ninja) ninja=makeNinja();
    ninja.x=200; ninja.y=groundY; ninja.vy=0; ninja.onGround=true;
    camX=0;
    if (!opts.noBanner) showBanner("Level "+(levelIndex+1)+"!", currentLevel().name);
    else banner=null;
  }

  function updateNinja(dt){
    ninja.t+=dt; ninja.anim+=dt; ninja.scarf+=dt;
    if (ninja.inv>0) ninja.inv-=dt;
    ninja.blink-=dt; if (ninja.blink<-2.8) ninja.blink=0.16;
    if (ninja.state==="bonk"){ if (ninja.anim>0.45) ninja.state="idle"; }
    else if (ninja.state==="slash"){ if (ninja.anim>0.28) ninja.state=ninja.onGround?"idle":"jump"; }
    else if (ninja.state==="throw"){ if (ninja.anim>0.32) ninja.state=ninja.onGround?"idle":"jump"; }

    let dir=0;
    if (held.left) dir-=1;
    if (held.right) dir+=1;
    if (dir && ninja.state!=="bonk"){
      ninja.x += dir*WALK_SP*dt;
      ninja.face = dir;
      if (ninja.onGround && ninja.state!=="slash" && ninja.state!=="throw"){ ninja.state="walk"; ninja.walk+=dt; }
    } else if (ninja.onGround && ninja.state!=="slash" && ninja.state!=="throw" && ninja.state!=="bonk"){
      ninja.state="idle";
    }

    if (held.jump && !jumpPrev) jumpBuf=0.14;
    jumpPrev=!!held.jump;
    if (jumpBuf>0) jumpBuf-=dt;
    if (ninja.onGround) coyote=0.12; else coyote-=dt;
    if (jumpBuf>0 && coyote>0 && ninja.state!=="bonk"){
      ninja.vy=JUMP_V; ninja.onGround=false; coyote=0; jumpBuf=0;
      ninja.state="jump"; Sfx.jump();
    }

    ninja.prevY=ninja.y;
    if (!ninja.onGround || ninja.vy!==0 || ninja.y<groundY-1){
      ninja.vy += GRAVITY*dt;
      ninja.y += ninja.vy*dt;
    }
    ninja.onGround=false;
    if (ninja.y>=groundY){ ninja.y=groundY; ninja.vy=0; ninja.onGround=true; }
    if (ninja.vy>=0){
      for (const p of platforms){
        if (ninja.x>p.x+10 && ninja.x<p.x+p.w-10){
          if (ninja.prevY<=p.y+10 && ninja.y>=p.y){ ninja.y=p.y; ninja.vy=0; ninja.onGround=true; }
        }
      }
    }
    ninja.x=clamp(ninja.x, 70, levelW-70);

    if (held.tri){ btnRepeat.tri-=dt; if (btnRepeat.tri<=0 && ninja.state!=="slash" && ninja.state!=="bonk"){ slashAttack(); btnRepeat.tri=0.32; } }
    if (held.x){ btnRepeat.x-=dt; if (btnRepeat.x<=0 && ninja.state!=="throw" && ninja.state!=="bonk"){ throwStar(zombieInFront()); btnRepeat.x=0.36; } }

    if (levelLock>0) levelLock-=dt;
    else if (flag && Math.abs(ninja.x-flag.x)<70 && ninja.y<=flag.y+36) nextLevel();
  }
  function updateZombies(dt){
    for (const z of zombies){
      z.wobble+=dt;
      z.y=groundY;
      if (z.state==="emerge"){ z.emerge=Math.min(1,z.emerge+dt/0.7); if (z.emerge>=1) z.state="walk"; continue; }
      if (z.state==="hit") continue;
      z.walk+=dt;
      if (ninja){
        const dir=Math.sign(ninja.x-z.x)||1;
        z.face=dir; z.x+=dir*z.speed*dt;
        if (Math.abs(z.x-ninja.x)<44 && Math.abs((z.y)-ninja.y)<50 && z.emerge>=1 && ninja.inv<=0) bonkNinja(z);
      }
    }
    zombies = zombies.filter((z)=>{
      if (z.state==="hit"){ z.hurt=(z.hurt||0)+dt; return z.hurt<0.05; }
      return z.x>camX-180 && z.x<levelW+80;
    });
  }
  function updateStars(dt){
    for (const s of shurikens){
      if (s.target){
        const z=zombies.find((q)=>q.id===s.target && q.state!=="hit");
        if (z){
          const a=angleTo(s.x,s.y,z.x,z.y-55);
          const sp=Math.hypot(s.vx,s.vy);
          s.vx=lerp(s.vx,Math.cos(a)*sp,0.12);
          s.vy=lerp(s.vy,Math.sin(a)*sp,0.12);
        }
      }
      s.x+=s.vx*dt; s.y+=s.vy*dt; s.rot+=s.rotv*dt; s.life-=dt;
      sparkle(s.x,s.y,1);
      for (const z of zombies){
        if (z.state==="hit" || z.emerge<0.3) continue;
        if (Math.hypot(s.x-z.x, s.y-(z.y-55))<42){ poofZombie(z); s.life=0; Sfx.ding(); break; }
      }
    }
    shurikens = shurikens.filter((s)=>s.life>0 && s.x>camX-60 && s.x<camX+W+60 && s.y>-40 && s.y<H+40);
  }
  function updateParticles(dt){
    for (const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.rot+=p.rotv*dt; p.life-=p.decay*dt; }
    particles = particles.filter((p)=>p.life>0);
    if (particles.length>280) particles.splice(0, particles.length-280);
  }
  function updateFloaters(dt){
    for (const f of floaters){ f.t+=dt; f.y-=50*dt; }
    floaters = floaters.filter((f)=>f.t<0.9);
  }
  function updatePlay(dt){
    levelTime+=dt; spawnTimer-=dt;
    const maxZ=3+(levelIndex>5?1:0);
    if (spawnTimer<=0 && zombies.filter((z)=>z.state!=="hit").length<maxZ){ spawnZombie(); spawnTimer=rand(1.6,2.6); }
    updateNinja(dt); updateZombies(dt); updateStars(dt); updateParticles(dt); updateFloaters(dt);
    if (ninja){
      const target=clamp(ninja.x-W*0.38, 0, Math.max(0, levelW-W));
      camX += (target-camX)*Math.min(1, 8*dt);
    }
    if (banner){ banner.t+=dt; if (banner.t>=banner.dur) banner=null; }
    if (cheer){ cheer.t+=dt; if (cheer.t>=cheer.dur) cheer=null; }
  }

  function drawParticles(c, space){
    for (const p of particles){
      if ((p.space||"world")!==space) continue;
      c.save(); c.globalAlpha=clamp(p.life,0,1); c.translate(p.x,p.y); c.rotate(p.rot); c.fillStyle=p.color;
      if (p.shape==="star") drawStarShape(c,0,0,p.size,p.color);
      else if (p.shape==="rect") c.fillRect(-p.size,-p.size*0.5,p.size*2,p.size);
      else { ellipse(c,0,0,p.size,p.size*0.75); c.fill(); }
      c.restore();
    }
    if (space!=="world") return;
    for (const f of floaters){
      c.save(); c.globalAlpha=clamp(1-f.t/0.9,0,1);
      text(c,f.str,f.x,f.y,26,f.color,"#1a1040",6);
      c.restore();
    }
  }
  function drawFrame(){
    const gyWas=groundY;
    layoutButtons();
    if (state==="play" && Math.abs(gyWas-groundY)>1) buildLevel();
    if (state==="title"){ drawTitle(ctx); return; }
    drawBackground(ctx, currentLevel(), time);
    ctx.save();
    ctx.translate(-camX, 0);
    drawTowerAndPlatforms(ctx);
    for (const z of zombies) drawZombie(ctx,z);
    if (ninja){
      if (ninja.inv>0 && Math.floor(time*16)%2===0) ctx.globalAlpha=0.65;
      drawNinja(ctx,ninja); ctx.globalAlpha=1;
    }
    for (const s of shurikens) drawShuriken(ctx,s);
    drawParticles(ctx,"world");
    ctx.restore();
    drawParticles(ctx,"screen");
    drawHUD(ctx);
    drawCheer(ctx);
    drawBanner(ctx);
    drawArrowBtn(ctx, buttons.left, -1, held.left);
    drawArrowBtn(ctx, buttons.right, 1, held.right);
    drawJumpBtn(ctx, buttons.jump, held.jump);
    drawButton(ctx, buttons.tri, "tri", held.tri);
    drawButton(ctx, buttons.x, "x", held.x);
  }

  function posFrom(t,r){ return { x:t.clientX-r.left, y:t.clientY-r.top }; }
  function pointerId(t){ return t.identifier!=null ? "t"+t.identifier : "mouse"; }
  function zombieAt(worldX,y){
    for (let i=zombies.length-1;i>=0;i--){
      const z=zombies[i]; if (z.state==="hit") continue;
      if (Math.hypot(worldX-z.x, y-(z.y-55))<56) return z;
    }
    return null;
  }
  function unbindPointer(id){
    const prev=pointers.get(id);
    pointers.delete(id);
    if (!prev) return;
    let still=false;
    for (const v of pointers.values()) if (v===prev) still=true;
    if (!still) held[prev]=false;
  }
  function bindPointer(id,x,y,isDown){
    if (state==="title"){
      if (isDown && (hitBtn(buttons.play,x,y) || y>H*0.4)){ playPressed=true; Sfx.button(); }
      return;
    }
    unbindPointer(id);
    const hit = hitBtn(buttons.left,x,y)?"left"
      : hitBtn(buttons.right,x,y)?"right"
      : hitBtn(buttons.jump,x,y)?"jump"
      : hitBtn(buttons.tri,x,y)?"tri"
      : hitBtn(buttons.x,x,y)?"x"
      : null;
    if (hit){
      const was=held[hit];
      pointers.set(id, hit);
      held[hit]=true;
      if (hit==="tri" && isDown && !was){ btnRepeat.tri=0.32; slashAttack(); }
      if (hit==="x" && isDown && !was){ btnRepeat.x=0.36; throwStar(zombieInFront()); }
      if (hit==="jump" && isDown) jumpBuf=0.14;
      return;
    }
    if (isDown){
      const z=zombieAt(x+camX,y);
      if (z) throwStar(z);
    }
  }
  function eachChanged(e, fn){
    const r=canvas.getBoundingClientRect();
    const list=e.changedTouches||[e];
    for (const t of list){
      if (t.clientX==null) continue;
      fn(pointerId(t), posFrom(t,r));
    }
  }
  function onDown(e){
    if (e && e.preventDefault) e.preventDefault();
    Sfx.unlock();
    eachChanged(e, (id,p)=>bindPointer(id,p.x,p.y,true));
  }
  function onUp(e){
    if (e && e.preventDefault) e.preventDefault();
    if (state==="title" && playPressed){ playPressed=false; startGame(); return; }
    eachChanged(e, (id)=>unbindPointer(id));
    if (!e.changedTouches && !e.touches){ unbindPointer("mouse"); }
  }
  function onMove(e){
    if (e && e.preventDefault) e.preventDefault();
    if (state!=="play") return;
    eachChanged(e, (id,p)=>{
      const kind=pointers.get(id);
      if (kind==="left"||kind==="right") bindPointer(id,p.x,p.y,false);
    });
  }

  const evOpts={passive:false};
  canvas.addEventListener("touchstart",onDown,evOpts);
  canvas.addEventListener("touchend",onUp,evOpts);
  canvas.addEventListener("touchcancel",onUp,evOpts);
  canvas.addEventListener("touchmove",onMove,evOpts);
  canvas.addEventListener("mousedown",onDown,evOpts);
  window.addEventListener("mouseup",onUp,evOpts);
  canvas.addEventListener("mousemove",(e)=>{ if (e.buttons) onMove(e); });
  canvas.addEventListener("contextmenu",(e)=>e.preventDefault());
  ["gesturestart","gesturechange","gestureend"].forEach((ev)=>document.addEventListener(ev,(e)=>e.preventDefault(),evOpts));
  document.addEventListener("dblclick",(e)=>e.preventDefault(),evOpts);
  document.addEventListener("touchmove",(e)=>e.preventDefault(),evOpts);

  const keyMap={
    ArrowLeft:"left", a:"left", A:"left",
    ArrowRight:"right", d:"right", D:"right",
    ArrowUp:"jump", w:"jump", W:"jump", " ":"jump", k:"jump", K:"jump",
    e:"tri", E:"tri", j:"tri", J:"tri",
    x:"x", X:"x", f:"x", F:"x"
  };
  window.addEventListener("keydown",(e)=>{
    const btn=keyMap[e.key];
    if (!btn) return;
    if (e.repeat) return;
    Sfx.unlock();
    if (state==="title" && (e.key==="Enter"||e.key===" "||e.key==="p"||e.key==="P")){ startGame(); return; }
    if (state!=="play") return;
    e.preventDefault();
    held[btn]=true;
    if (btn==="tri"){ btnRepeat.tri=0.32; slashAttack(); }
    if (btn==="x"){ btnRepeat.x=0.36; throwStar(zombieInFront()); }
    if (btn==="jump") jumpBuf=0.14;
  });
  window.addEventListener("keyup",(e)=>{
    const btn=keyMap[e.key];
    if (btn) held[btn]=false;
  });

  function resize(){
    const vv=window.visualViewport;
    W=Math.max(1, Math.round(vv?vv.width:window.innerWidth));
    H=Math.max(1, Math.round(vv?vv.height:window.innerHeight));
    DPR=Math.min(2.5, window.devicePixelRatio||1);
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layoutButtons();
    if (state==="play") buildLevel();
    if (ninja){
      ninja.x=clamp(ninja.x,70,levelW-70);
      if (ninja.onGround) ninja.y=Math.min(ninja.y, groundY);
    }
  }
  window.addEventListener("resize",resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize",resize);
  resize();

  function loop(ts){
    if (!lastTs) lastTs=ts;
    let dt=(ts-lastTs)/1000; lastTs=ts;
    if (dt>0.05) dt=0.05;
    time+=dt;
    if (state==="play"){ updatePlay(dt); Sfx.tick(dt); }
    drawFrame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function setupShot(){
    const params=new URLSearchParams(location.search);
    const shot=params.get("shot");
    if (!shot) return;
    shotMode=true;
    resize();
    if (shot==="title"){ state="title"; return; }
    if (shot==="play"){
      startGame();
      const lv=parseInt(params.get("level")||"0",10)||0;
      goToLevel(lv,{ noBanner: params.get("banner")!=="1" });
      stars=parseInt(params.get("stars")||"12",10);
      zombies=[];
      if (ninja){ ninja.x=1100; ninja.face=1; ninja.y=groundY; }
      camX=Math.max(0, 1100-W*0.38);
      spawnZombie({x:1300, emerged:true, silent:true});
      spawnZombie({x:1600, emerged:true, silent:true});
      if (params.get("banner")==="1") showBanner("Level "+(lv+1)+"!", currentLevel().name);
    }
  }
  setupShot();

  window.__DESTIN__ = {
    ready:true,
    getState(){ return { state, stars, levelIndex, levelName:currentLevel().name, levelKills, levelTime, zombieCount:zombies.length, ninja: ninja?{x:ninja.x,y:ninja.y,vy:ninja.vy,state:ninja.state,face:ninja.face,onGround:ninja.onGround}:null, buttons, W, H, groundY, camX, levelW, flag, platformCount:platforms.length }; },
    startGame, goToLevel, nextLevel,
    press(btn){
      Sfx.unlock();
      if (btn==="play"){ startGame(); return; }
      if (btn==="triangle"||btn==="tri") slashAttack();
      if (btn==="x"||btn==="star") throwStar(zombieInFront());
      if (btn==="jump") jumpBuf=0.14;
      if (btn==="left"||btn==="right"){ held[btn]=true; }
    },
    hold(btn, down){
      Sfx.unlock();
      if (btn==="triangle") btn="tri";
      if (btn==="star") btn="x";
      held[btn]=!!down;
      if (down && btn==="jump") jumpBuf=0.14;
      if (down && btn==="tri"){ btnRepeat.tri=0.32; slashAttack(); }
      if (down && btn==="x"){ btnRepeat.x=0.36; throwStar(zombieInFront()); }
    },
    tap(x,y){
      onDown({ preventDefault(){}, clientX:x, clientY:y, changedTouches:null, touches:null });
      onUp({ preventDefault(){}, clientX:x, clientY:y, changedTouches:null, touches:null });
    },
    spawnZombie, slashAttack, throwStar,
    setStars(n){ stars=n; },
    setNinja(x,y){ if (!ninja) ninja=makeNinja(); if (x!=null) ninja.x=x; if (y!=null){ ninja.y=y; ninja.onGround=false; } },
    unlockAudio(){ Sfx.unlock(); }
  };
})();
</script>
</body>
